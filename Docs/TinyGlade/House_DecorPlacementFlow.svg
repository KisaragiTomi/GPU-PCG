<svg viewBox="0 0 1360 774" width="1360" height="774" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <pattern id="pickable-domain-cross-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#e0e7ff"/>
      <path d="M0 6H12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
      <path d="M6 0V12" stroke="#4f46e5" stroke-width="1" opacity="0.316770"/>
    </pattern>
    <pattern id="buffer-owner-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#e2e8f0"/>
      <rect y="1" width="10" height="2" fill="#334155" opacity="0.291429"/>
      <rect y="6" width="10" height="1.5" fill="#334155" opacity="0.291429"/>
    </pattern>
    <pattern id="autoobject-dot-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#cffafe"/>
      <circle cx="3" cy="3" r="1.25" fill="#0891b2" opacity="0.256281"/>
      <circle cx="9" cy="9" r="1.25" fill="#0891b2" opacity="0.256281"/>
    </pattern>
    <pattern id="sv-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#dbeafe"/>
      <rect y="1" width="10" height="2" fill="#0284c7" opacity="0.235023"/>
      <rect y="6" width="10" height="1.5" fill="#0284c7" opacity="0.235023"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .box    { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; }
    .core   { fill:url(#pickable-domain-cross-bg); stroke:#4f46e5; stroke-width:1.6; }
    .owner  { fill:url(#buffer-owner-stripe-bg); stroke:#334155; stroke-width:1.2; }
    .placed { fill:url(#autoobject-dot-bg); stroke:#0891b2; stroke-width:1.2; }
    .sv-stripe { fill:url(#sv-stripe-bg); stroke:#0284c7; stroke-width:1.2; }
    .note   { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; }
    .t  { font-size:13.5px; font-weight:600; fill:#0f172a; }
    .b  { font-size:12px; fill:#334155; }
    .m  { font-size:12px; fill:#64748b; }
    .flow { stroke:#475569; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .rej  { font-weight:700; fill:#dc2626; }
    .keep { font-weight:700; fill:#0891b2; }
  </style>

  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">D12 摆件 / 植被放置流程 —— 场在 GPU · 异步回读 · diff 应用</text>
  <text x="30" y="60" class="m">放置物 = ACSGroundDecorItem 子类 actor · 不做 dirty，松手提交时全局重生成 · 场/热力图存 GPU，CPU 异步取回，全程不阻塞 GT · 配 Plan_House.md D12</text>

  <!-- 状态横幅（2026-09-18）：本图是设计稿，不是现状 -->
  <rect x="30" y="72" width="1300" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="44" y="90" font-size="11.5px" font-weight="600" fill="#9a3412">⚠ 状态（2026-09-18）：本图是 D12「复杂度场」那一半的设计，尚未实施 —— C2 裁决五定为保留自有设计、暂不做；图中 ACSGroundDecorItem / RT_DecorField / NotifyEditCommitted 在代码里都不存在。</text>
  <text x="44" y="108" font-size="11.5px" fill="#9a3412">已落地的是锚点层（2026-08-31）：CSHouseDecor 房子四家（门 / 墙脚 / 檐口 / 屋脊，窗那家留了接口）+ CSGroundDecor 塑形物裙边一家，共用 BuildPlan / Pack，随各自宿主重求值同步重排、零回读。</text>

  <g transform="translate(0,34)">
  <!-- ================= 主流程 ================= -->
  <rect x="30" y="100" width="660" height="78" rx="8" class="owner"/>
  <text x="44" y="122" class="t">输入（CPU 权威侧，打包上传给场 pass）</text>
  <text x="44" y="144" class="b">房屋墙段 + 门前净空（全部房子） · 地面镜像 Colors（R=道路）/ Heights</text>
  <text x="44" y="161" class="b">DecorPalette：各类 CDO 的 Priority / Channel / Bound 参数 / SameClassRadius</text>

  <path class="flow" d="M360 178V194"/>

  <rect x="30" y="196" width="660" height="94" rx="8" class="box"/>
  <text x="44" y="218" class="t">① 场重算 —— GPU compute pass 写 RT_DecorField，全网格 dispatch</text>
  <text x="44" y="240" class="b">XY = 方向场：最近墙段外法线的距离加权混合（摆件朝向）</text>
  <text x="44" y="258" class="b">Z = 物体复杂度：贴墙窄带随距衰减；门前净空、房 footprint 内清零</text>
  <text x="44" y="276" class="b">W = 植被复杂度：宽带 + 墙角加成；道路上清零、路缘加成 —— 算完发起<tspan class="keep">异步回读</tspan></text>

  <path class="flow" d="M360 290V306"/>

  <rect x="30" y="308" width="660" height="76" rx="8" class="box"/>
  <text x="44" y="330" class="t">② 分层候选（场就绪后，典型 2-3 帧）—— 按 CDO Priority 从高到低</text>
  <text x="44" y="352" class="b">物体层：tile-argmax（每 ~200cm tile 取 Z 最大格，过阈即候选）</text>
  <text x="44" y="369" class="b">植被层：抖动网格按 W 伯努利 —— 随机一律位置哈希</text>

  <path class="flow" d="M360 384V400"/>

  <rect x="30" y="402" width="660" height="96" rx="8" class="core"/>
  <text x="44" y="424" class="t">③ 逐候选谓词（格坐标字典序，纯函数进单测）</text>
  <text x="44" y="446" class="b">跨层：候选 bound（OBB，含 Scale/Offset）∩ 更高层已放 bound → <tspan class="rej">拒</tspan>（植被不压物体）</text>
  <text x="44" y="464" class="b">同类：中心距 &lt; 两者 SameClassRadius 之和 → <tspan class="rej">拒</tspan>（同样的物体不过近）</text>
  <text x="44" y="481" class="b">房 footprint 内 / 道路上 / 门前净空 / 陡坡 → <tspan class="rej">拒</tspan> —— 已放集合撒进 occupancy 网格，只查邻格</text>

  <path class="flow" d="M360 498V514"/>

  <rect x="30" y="516" width="660" height="58" rx="8" class="placed"/>
  <text x="44" y="538" class="t">④ 放置表 —— {class, transform, 稳定 id = hash(class, 格坐标)}</text>
  <text x="44" y="558" class="b">朝向 ← XY 方向场 · 落高 ← 镜像 Heights（CPU 权威，不经 GPU）</text>

  <path class="flow" d="M360 574V590"/>

  <rect x="30" y="592" width="660" height="78" rx="8" class="placed"/>
  <text x="44" y="614" class="t">⑤ diff 应用 —— 新放置表 vs 现存 decor actor 按稳定 id 对齐</text>
  <text x="44" y="636" class="b">同 id 同 transform → <tspan class="keep">原 actor 不动</tspan> · 新增 → spawn · 消失 → destroy（RF_Transient）</text>
  <text x="44" y="653" class="m">全局更新语义不变，但每次提交只 churn 受影响的一小片 → 随后上传 bound 画热力图（GPU）→ 再异步回读供 D13 藤蔓起点</text>

  <!-- ================= 右侧配套 ================= -->
  <rect x="720" y="196" width="610" height="88" rx="8" class="sv-stripe"/>
  <text x="734" y="218" class="t">触发：只在编辑提交时（不引入 dirty）</text>
  <text x="734" y="240" class="b">拖拽中只 MarkDecorDirty 标脏（房屋增删移改 / 画路 / 塑形物），不生成</text>
  <text x="734" y="257" class="b">松手 NotifyEditCommitted → 若脏则合并成一次全局重生成（无需节流）</text>
  <text x="734" y="274" class="m">与 D13 藤蔓同一边界；装饰不写镜像/不广播/不进房屋名单 → 只出不进，无环</text>

  <path class="flow" d="M720 240H694"/>

  <rect x="720" y="300" width="610" height="152" rx="8" class="placed"/>
  <text x="734" y="322" class="t">ACSGroundDecorItem —— 摆件 / 植被公用父类（纯 AActor）</text>
  <text x="734" y="344" class="b">StaticMesh 组件（视觉） + UBoxComponent 放置 bound（只做放置查询，物理关闭）</text>
  <text x="734" y="362" class="b">bound 默认自动贴合 StaticMesh bounds，再乘 BoundScale、加 BoundOffset</text>
  <text x="734" y="380" class="b">Priority：普通物体高（100）/ 植被低（10）—— 决定分层顺序与"低让高"</text>
  <text x="734" y="398" class="b">Channel：该类采样 Z（物体）还是 W（植被）</text>
  <text x="734" y="416" class="b">SameClassRadius：同类间距球，≤0 时默认取 StaticMesh 包围球半径</text>
  <text x="734" y="434" class="m">BP 子类改 CDO 默认值即完成配置；RF_Transient 派生物，随重生成重建</text>

  <rect x="720" y="464" width="610" height="96" rx="8" class="box"/>
  <text x="734" y="486" class="t">全局重算的稳定性（可用的前提）</text>
  <text x="734" y="508" class="b">随机 = 位置哈希（tile/格坐标 → [0,1)）：未受影响区域放置表逐位相同</text>
  <text x="734" y="526" class="b">层内处理顺序钉死为格坐标字典序：同输入必同输出（重叠测试有顺序依赖）</text>
  <text x="734" y="543" class="b">再经 ⑤ diff：别处动一下，这里的箱子一个都不跳</text>

  <rect x="720" y="572" width="610" height="54" rx="8" class="note"/>
  <text x="734" y="594" class="t">纪律：零回读 → 零阻塞回读</text>
  <text x="734" y="614" class="b">交互热路径仍禁止任何回读；提交链允许异步回读（不阻塞 + 代数戳防过期）</text>

  <!-- ================= 图例 ================= -->
  <rect x="30"  y="700" width="18" height="12" class="owner"/>
  <text x="54"  y="710" class="m">CPU 权威输入</text>
  <rect x="170" y="700" width="18" height="12" class="box"/>
  <text x="194" y="710" class="m">派生计算阶段</text>
  <rect x="310" y="700" width="18" height="12" class="core"/>
  <text x="334" y="710" class="m">谓词裁决</text>
  <rect x="430" y="700" width="18" height="12" class="placed"/>
  <text x="454" y="710" class="m">放置产物 / decor actor</text>
  <rect x="610" y="700" width="18" height="12" class="sv-stripe"/>
  <text x="634" y="710" class="m">触发（提交时）</text>
  </g>
</svg>
