  <rect x="20" y="658" width="1730" height="166" rx="8" class="box"/>
  <text x="34" y="680" class="t">顺序约束：只写在注释里，颠倒不报错、只出错画面</text>
  <text x="34" y="700" class="n">② 必须在 ④ 前：洞的弧长从锚点现解，排在后面洞会用上一轮的锚点、框却已按新锚点摆好 ⇒ 框洞分家（ReevaluateSite 注释）。</text>
  <text x="34" y="716" class="n">③ 必须在 ④ 前：两者互不读，排在前面只为进同一份 BodyHash（注释原话「接缝裁剪必须排在门之前只有一个理由」）。③ 内协议先跑：开关关着也要把空发给对端；</text>
  <text x="34" y="732" class="n">　拖动帧（③ 读到冻结标志）只用旧 Contacts 不发；松手那一轮才扫 world 名单（UCSHouseLibrary::GetHouses）、给每个对端 ReceiveContactFrom —— 对端只置脏，等它自己的 Tick 兑现。</text>
  <text x="34" y="748" class="n">④ 必须在 ⑤⑦⑧⑩⑪⑫ 前：它们都读 CurrentOpenings；ResolvePierSpans 又必须在窗过完谓词之后、形状哈希之前，晚一步 = 墩位翻了房体不重建。</text>
  <text x="34" y="764" class="n">⑦ 内部六家 Build*Bricks 的顺序决定砖的槽位 ⇒ 门框砖的逐实例随机数（换序 = 整墙砖变色）；接缝砖的随机数改由接触的 Seed() + 柱号派生，与槽位无关。</text>
  <text x="34" y="780" class="n">⑫ 必须最后：读 ④ 写好的 CurrentFeatureVerdicts。SnapToAnchor 不发 PostEditMove、不会重入；标记登记只 RequestReevaluate（置脏，下一 tick 合批）。</text>
  <text x="34" y="796" class="n">图中未单列：⑫ 之后还有 SyncEdgeHandlesToFootprint（拉尺寸模式里锥子按新边数对齐，只读 footprint）；⑤⑥ 的 Pending / BuiltAt / 两级哈希在基类 FCSMeshSlotState；</text>
  <text x="34" y="812" class="n">　① 的 SetActorLocation 会触发根组件 TransformUpdated，重求值期间被 bInReevaluate 挡掉，否则每次落座多提交一轮。</text>
