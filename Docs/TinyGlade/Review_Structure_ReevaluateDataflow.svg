  <text x="20" y="36" font-size="20" font-weight="700" fill="#0f172a">ACSHouseActor::ReevaluateSite：靠成员变量传递的隐式数据流（按 2026-09-18 代码：接缝改接触记录）</text>
  <text x="20" y="58" class="m" font-size="12px">步骤按调用顺序从左到右（CSHouseActor.cpp:1075 ReevaluateSite）；实线 = 写入，虚线 = 读取，双箭头 = 读写；「必须排在…之后」的顺序约束只存在于注释里 · 配 Review_Structure.md 大问题 2 · 09-11 版的 ②–⑪ 因新增 ② 锚点列顺延为 ③–⑫</text>
