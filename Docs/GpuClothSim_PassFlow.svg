<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
  <title id="title">GpuClothSim Pass Flow</title>
  <desc id="desc">UCSClothSimComponent per-frame flow: game-thread input collection, one render-thread FRDGBuilder graph with the XPBD substep loop (graph-coloured Gauss-Seidel) reading FCSClothGpuState, normals, and the FCSMeshRenderThreadEdit write-back boundary into UCSMesh resident streams.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <pattern id="retained-stripe-bg" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect y="1" width="10" height="2" fill="#d97706" opacity="0.264249"/>
      <rect y="6" width="10" height="1.5" fill="#d97706" opacity="0.264249"/>
    </pattern>
    <pattern id="csmesh-resident-cross-bg" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#f3e8ff"/>
      <path d="M0 6H12" stroke="#7c3aed" stroke-width="1" opacity="0.293103"/>
      <path d="M6 0V12" stroke="#7c3aed" stroke-width="1" opacity="0.293103"/>
    </pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; }
      .h1 { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .phaseTitle { font-size: 15px; font-weight: 700; }
      .nodeTitle { font-size: 13px; font-weight: 700; }
      .body { font-size: 11px; fill: #334155; }
      .tiny { font-size: 10px; fill: #64748b; }
      .label { font-size: 10px; font-weight: 700; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .cpu { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
      .gpu { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; }
      .io { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; }
      .mesh { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 1.4; }
      .data { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.1; }
      .state { fill: url(#retained-stripe-bg); stroke: #d97706; stroke-width: 1.6; }
      .resident { fill: url(#csmesh-resident-cross-bg); stroke: #7c3aed; stroke-width: 1.6; }
      .loopBox { fill: none; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .scopeBox { fill: none; stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .noteBox { fill: #fffbeb; stroke: #d97706; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .setupBox { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .arrow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .arrowThin { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .arrowGpu { stroke: #15803d; stroke-width: 1.5; fill: none; marker-end: url(#arrowGreen); }
      .arrowViolet { stroke: #7c3aed; stroke-width: 1.5; fill: none; marker-end: url(#arrowViolet); }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1280" height="1160" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="32" y="24" width="1216" height="84" rx="10" fill="url(#headerGrad)" stroke="#cbd5e1"/>
  <text class="h1" x="640" y="60" text-anchor="middle">GPU 布料模拟：每帧 pass 流程</text>
  <text class="subtitle mono" x="640" y="88" text-anchor="middle">UCSClothSimComponent -&gt; FRDGBuilder(substeps) -&gt; FCSMeshRenderThreadEdit -&gt; UCSMesh streams</text>

  <!-- Legend -->
  <g>
    <rect class="cpu" x="52" y="122" width="18" height="18" rx="3"/>
    <text class="body" x="78" y="136">Game Thread</text>
    <rect class="gpu" x="190" y="122" width="18" height="18" rx="3"/>
    <text class="body" x="216" y="136">RT compute pass</text>
    <rect class="state" x="360" y="122" width="18" height="18" rx="3"/>
    <text class="body" x="386" y="136">FCSClothGpuState（组件自持 pooled）</text>
    <rect class="resident" x="670" y="122" width="18" height="18" rx="3"/>
    <text class="body" x="696" y="136">UCSMesh 常驻流</text>
    <rect class="scopeBox" x="860" y="122" width="18" height="18" rx="3"/>
    <text class="body" x="886" y="136">FCSMeshRenderThreadEdit 作用域</text>
  </g>

  <!-- Band A: Game Thread -->
  <rect class="band" x="32" y="162" width="1216" height="130" rx="10"/>
  <text class="phaseTitle" x="48" y="186">Game Thread — UCSClothSimComponent::TickComponent（TG_PostPhysics）</text>
  <rect class="cpu" x="56" y="200" width="310" height="64" rx="8"/>
  <text class="nodeTitle" x="72" y="222">收集帧输入</text>
  <text class="body" x="72" y="244">dt 钳制 / 风 / 碰撞体形状 / 钉组变换（上一帧 + 本帧）</text>
  <rect class="cpu" x="410" y="200" width="330" height="64" rx="8"/>
  <text class="nodeTitle" x="426" y="222">Generation / AllocationGeneration 校验</text>
  <text class="body" x="426" y="244">与 setup 缓存不一致或见到 NaN → 停摆 + log</text>
  <rect class="cpu" x="784" y="200" width="300" height="64" rx="8"/>
  <text class="nodeTitle mono" x="800" y="222">ENQUEUE_RENDER_COMMAND</text>
  <text class="body" x="800" y="244">每帧一条；自建图 → 当帧生效，零阻塞</text>
  <path class="arrow" d="M366 232 H410"/>
  <path class="arrow" d="M740 232 H784"/>
  <path class="arrow" d="M934 264 V312"/>

  <!-- Band B: Render Thread graph -->
  <rect class="band" x="32" y="312" width="1216" height="632" rx="10"/>
  <text class="phaseTitle" x="48" y="336">Render Thread — 每帧一张自建 FRDGBuilder 图（不 flush）</text>

  <!-- Substep loop -->
  <rect class="loopBox" x="56" y="352" width="520" height="390" rx="10"/>
  <text class="label" x="72" y="372" fill="#15803d">substep 循环 ×8（small-steps XPBD）</text>
  <rect class="gpu" x="80" y="388" width="300" height="58" rx="8"/>
  <text class="nodeTitle" x="96" y="406">Predict（1 thread/粒子）</text>
  <text class="tiny mono" x="96" y="424">v = (x-xPrev)/dtPrev·damp + (g+wind)·dt</text>
  <text class="tiny" x="96" y="438">x += v·dt；钉住粒子 = 钉组变换 × rest（插值）</text>
  <path class="arrowGpu" d="M230 446 V466"/>
  <rect class="loopBox" x="80" y="466" width="470" height="164" rx="8"/>
  <text class="label" x="96" y="484" fill="#15803d">约束迭代 ×1：按颜色的 Gauss-Seidel</text>
  <rect class="gpu" x="96" y="496" width="210" height="52" rx="8"/>
  <text class="nodeTitle" x="110" y="516">SolveColor × 13</text>
  <text class="tiny" x="110" y="536">拉伸 + 弯曲，一种颜色一次派发</text>
  <rect class="gpu" x="330" y="496" width="204" height="52" rx="8"/>
  <text class="nodeTitle" x="344" y="516">SolveColor × 1</text>
  <text class="tiny" x="344" y="536">tether（单边），排在最后</text>
  <rect class="noteBox" x="96" y="568" width="438" height="52" rx="8"/>
  <text class="tiny" x="110" y="588">setup 时上色：同色约束不共享可动粒子 → 直接改写两端位置</text>
  <text class="tiny" x="110" y="606">没有原子、没有 Jacobi 平均；λ 每个 substep 从零起算</text>
  <path class="arrowGpu" d="M306 522 H330"/>
  <path class="arrowGpu" d="M230 630 V654"/>
  <rect class="gpu" x="80" y="654" width="300" height="58" rx="8"/>
  <text class="nodeTitle" x="96" y="672">Collide（1 thread/粒子，有碰撞体时）</text>
  <text class="tiny" x="96" y="690">analytic：半空间 / 球 / 胶囊投影 + 摩擦</text>
  <text class="tiny" x="96" y="704">碰撞体按上一帧 / 本帧形状插值</text>
  <path class="arrowGpu dash" d="M80 683 H68 V417 H76"/>
  <text class="tiny" x="96" y="732">循环 substep 次后进入法线与写回</text>

  <!-- FCSClothGpuState -->
  <rect class="state" x="690" y="352" width="250" height="250" rx="10"/>
  <text class="nodeTitle" x="706" y="376">FCSClothGpuState</text>
  <text class="tiny" x="706" y="394">组件自持 TRefCountPtr&lt;FRDGPooledBuffer&gt;</text>
  <text class="tiny mono" x="706" y="416">Positions(w=InvMass) / Prev ×N</text>
  <text class="tiny mono" x="706" y="435">RestPositions / PinGroups ×N</text>
  <text class="tiny mono" x="706" y="454">ParticleNormals / RestNormals ×N</text>
  <text class="tiny mono" x="706" y="473">NormalAccum（定点）×3N</text>
  <text class="tiny mono" x="706" y="492">Constraints（按颜色）+ λ ×C</text>
  <text class="tiny mono" x="706" y="511">CornerToParticle / RestTangents ×V</text>
  <text class="tiny mono" x="706" y="530">PinTransforms / Colliders（每帧）</text>
  <line x1="706" y1="544" x2="924" y2="544" stroke="#d97706" stroke-width="0.8"/>
  <text class="tiny" x="706" y="562">过 CSGpuMemoryBudget 预检</text>
  <text class="tiny" x="706" y="578">跨图访问态交给 RDG 默认收尾</text>
  <path class="arrow" d="M576 460 H690"/>
  <text class="label" x="633" y="452" text-anchor="middle">RW 粒子 / λ</text>
  <path class="arrow" d="M690 520 H576"/>
  <text class="label" x="633" y="512" text-anchor="middle">只读 约束 / 映射域</text>

  <!-- Side notes -->
  <rect class="noteBox" x="964" y="352" width="252" height="140" rx="8"/>
  <text class="nodeTitle" x="980" y="374">P2 宿主切换（未做）</text>
  <text class="body" x="980" y="394">EnqueueGDFJob 每帧 re-enqueue，</text>
  <text class="body" x="980" y="412">整张图挪进渲染器 base pass 后</text>
  <text class="body" x="980" y="430">（GDF 参数此刻才就绪）</text>
  <text class="body" x="980" y="448">代价：解算结果晚一帧上屏</text>
  <text class="tiny mono" x="980" y="474">GDFSampleService.h:106 / .cpp:24</text>
  <rect class="setupBox" x="964" y="516" width="252" height="128" rx="8"/>
  <text class="nodeTitle" x="980" y="538">RDG 纪律</text>
  <text class="body" x="980" y="558">全部 pass 用参数结构体声明依赖；</text>
  <text class="body" x="980" y="576">颜色之间的写后读由 RDG 排序，</text>
  <text class="body" x="980" y="594">并插 UAV 屏障</text>
  <text class="tiny mono" x="980" y="620">r.RDG.ImmediateMode=1：10/10，逐位相同</text>

  <!-- Normals, then the write-back scope -->
  <path class="arrowGpu" d="M120 742 V816"/>
  <text class="tiny" x="132" y="760">substep 循环结束后，同图内继续</text>
  <rect class="gpu" x="80" y="816" width="230" height="72" rx="8"/>
  <text class="nodeTitle" x="96" y="838">Accumulate / FinalizeNormals</text>
  <text class="tiny" x="96" y="856">1 thread/三角 → 1 thread/粒子</text>
  <text class="tiny" x="96" y="872">角度加权，定点原子累加</text>
  <rect class="scopeBox" x="340" y="766" width="276" height="160" rx="10"/>
  <text class="label" x="356" y="788" fill="#7c3aed">FCSMeshRenderThreadEdit 作用域</text>
  <text class="tiny" x="356" y="804">只登记 Position / TangentBasis 两条流</text>
  <rect class="mesh" x="360" y="816" width="236" height="90" rx="8"/>
  <text class="nodeTitle" x="374" y="838">SkinBack（1 thread/渲染顶点）</text>
  <text class="tiny mono" x="374" y="856">Pos[v] = x[CornerToParticle[v]] + O</text>
  <text class="tiny" x="374" y="872">rest 切线基 × 粒子法线的最小旋转</text>
  <text class="tiny" x="374" y="890">非有限 → 不写回、计数，GT 停摆</text>
  <path class="arrowGpu" d="M310 852 H360"/>
  <path class="arrowViolet" d="M596 852 H690"/>

  <!-- UCSMesh resident streams -->
  <rect class="resident" x="690" y="772" width="250" height="120" rx="10"/>
  <text class="nodeTitle" x="706" y="796">UCSMesh · FCSMeshResident</text>
  <text class="tiny mono" x="706" y="816">RW_MeshPositions / RW_MeshTangents</text>
  <text class="tiny" x="706" y="836">buffer 身份不变 → proxy 零重建</text>
  <text class="tiny" x="706" y="852">AllocationGeneration 不动</text>
  <text class="tiny" x="706" y="868">Generation 不 bump（BorrowedGraph）</text>

  <!-- Band C: consumers -->
  <path class="arrowViolet" d="M760 892 V946 H236 V1012"/>
  <path class="arrowViolet" d="M850 892 V954 H665 V1012"/>
  <rect class="band" x="32" y="978" width="1216" height="132" rx="10"/>
  <text class="phaseTitle" x="48" y="1002">消费侧 — 绑定同一个 UCSMesh</text>
  <rect class="mesh" x="56" y="1014" width="360" height="76" rx="8"/>
  <text class="nodeTitle" x="72" y="1038">UCSMeshRenderComponent</text>
  <text class="body" x="72" y="1058">SetGpuMesh 绑定；每帧绘制同一批 buffer</text>
  <text class="tiny" x="72" y="1076">ShadowCacheInvalidationBehavior = Always（VSM 不缓存）</text>
  <rect class="io" x="470" y="1014" width="390" height="76" rx="8"/>
  <text class="nodeTitle" x="486" y="1038">CopyToStaticMesh / ReadbackMeshSync</text>
  <text class="body" x="486" y="1058">冻结当前姿态成资产——免费副产品</text>
  <text class="tiny" x="486" y="1076">NaN 检测在写回前，防落盘带毒</text>
  <rect class="setupBox" x="914" y="1014" width="302" height="76" rx="8"/>
  <text class="nodeTitle" x="930" y="1038">Setup 前置（一次性，见 D5）</text>
  <text class="body" x="930" y="1058">回读 → 焊接 / 约束 / 上色 → 上传</text>
  <text class="tiny" x="930" y="1076">运行循环零回读、零阻塞</text>

  <text class="tiny" x="640" y="1136" text-anchor="middle">对应 GpuClothSim_Plan.md 的 D2 组件与 tick / D3 求解循环；按 2026-10-26 的代码</text>
</svg>
