[CoreRedirects]
+PackageRedirects=(OldName="/TAToolsPlugin",NewName="/PCGPlugins",MatchSubstring=true)
+PackageRedirects=(OldName="/Script/CSEditorProcess",NewName="/Script/PCGEditorProcess")
+PackageRedirects=(OldName="/Script/GeometryScriptExtra",NewName="/Script/GeometryScriptExtraEditor")
+ClassRedirects=(OldName="/Script/PCGEditorProcess.CSLandscapeTempLayer",NewName="/Script/PCGEditorProcess.CSLandscape")
+ClassRedirects=(OldName="/Script/FoliageCluster.FoliageConverter",NewName="/Script/GeometryScriptExtraEditor.FoliageConverter")
