; AVineContainer 从 GeometryScriptExtraEditor(Editor) 下沉到 ComputeShaderGenerator(Runtime)，
; 好让 Runtime 侧的消费者（TinyGlade 房屋等）能直接引用它。类的 script path 随模块改变，
; 而已存盘的关卡/蓝图记的是旧路径，靠下面这组重定向续上。
;
; 三条 ClassRedirects 都直指最终位置而不是接力：重定向链是否传递解析没有保证，
; 每个历史路径各给一跳最省心。Property/Function 的 OldName 保持历史路径不动（那是包里
; 真正记着的名字），只把 NewName 挪到新模块。
+ClassRedirects=(OldName="/Script/GeometryScriptExtra.VineContainer",NewName="/Script/ComputeShaderGenerator.VineContainer")
+ClassRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer",NewName="/Script/ComputeShaderGenerator.VineContainer")
+ClassRedirects=(OldName="/Script/FoliageCluster.ConvertFoliageInstanceContainer",NewName="/Script/ComputeShaderGenerator.VineContainer")
+StructRedirects=(OldName="/Script/GeometryScriptExtraEditor.SpaceColonizationOptions",NewName="/Script/ComputeShaderGenerator.SpaceColonizationOptions")
+StructRedirects=(OldName="/Script/GeometryScriptExtraEditor.VV",NewName="/Script/ComputeShaderGenerator.VV")

+PropertyRedirects=(OldName="/Script/FoliageCluster.ConvertFoliageInstanceContainer.FoliageInstanceContainer",NewName="/Script/ComputeShaderGenerator.VineContainer.GrowTarget")
+PropertyRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.FoliageInstanceContainer",NewName="/Script/ComputeShaderGenerator.VineContainer.GrowTarget")
+PropertyRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.TubeFoliageInstanceContainer",NewName="/Script/ComputeShaderGenerator.VineContainer.TubeVineSource")
+PropertyRedirects=(OldName="/Script/ComputeShaderGenerator.CSShallowWaterCapture.SimVisISM",NewName="/Script/ComputeShaderGenerator.CSShallowWaterCapture.SimVisHISM")
+PropertyRedirects=(OldName="/Script/ComputeShaderGenerator.CSShallowWaterCapture.VisualizeMesh",NewName="/Script/ComputeShaderGenerator.CSShallowWaterCapture.ResultMeshComponent")

+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.AddInstance",NewName="/Script/ComputeShaderGenerator.VineContainer.ImportFoliageToTransformArray")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.AddInstanceFromFoliageType",NewName="/Script/ComputeShaderGenerator.VineContainer.ImportFoliageToTransformArray")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.ConvertInstance",NewName="/Script/ComputeShaderGenerator.VineContainer.ExportTransformArrayToFoliage")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.ConvertInstanceToFoliage",NewName="/Script/ComputeShaderGenerator.VineContainer.ExportTransformArrayToFoliage")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.ReverFoliage",NewName="/Script/ComputeShaderGenerator.VineContainer.RevertFoliage")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.VineContainer.GenerateVine",NewName="/Script/ComputeShaderGenerator.VineContainer.GenerateVineAction")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.FoliageConverter.ConvertFoliageToInstanceComponent",NewName="/Script/GeometryScriptExtraEditor.FoliageConverter.ConvertFoliageToTransformArray")
+FunctionRedirects=(OldName="/Script/GeometryScriptExtraEditor.FoliageConverter.ConvertInstanceComponentToFoliage",NewName="/Script/GeometryScriptExtraEditor.FoliageConverter.ConvertTransformArrayToFoliage")

